# TRELLIS 命令行推理配置文件

# ==========================================
# 基础路径配置
# ==========================================
input_dir: "input/test"   # 输入图片文件夹路径
output_dir: "output/test" # 输出产物文件夹路径

# ==========================================
# 推理核心参数
# ==========================================
seed: 0                   # 随机种子。固定种子可以让你在相同输入下获得一致的生成结果。
randomize_seed: false      # 是否随机化种子。如果设为 true，则会忽略上面的 seed 参数。

# 第一阶段：稀疏结构生成 (决定物体的大致轮廓和形状)
# 影响：如果物体出现形状缺失、断裂、或大面积崩坏，通常需要调整这一部分。
ss_sampling_steps: 20      # 采样步数。调高（如 20-30）可提高形状的稳定性，但会增加生成时间。
ss_guidance_strength: 30  # 引导强度。值越高，形状越接近输入图片的“特征”；值过高可能导致几何畸变。

# 第二阶段：结构化潜变量生成 (决定物体的表面细节、精细度和纹理)
# 影响：如果 Mesh 表面有很多噪声、凹凸不平或者纹理模糊，请调整这一部分。
slat_sampling_steps: 20    # 采样步数。如果你发现模型表面不平滑，调高此值（如 20）通常会有显著改善。
slat_guidance_strength: 5.0 # 引导强度。控制细节的锐利程度，默认 3.0 是一个平衡点。

# ==========================================
# 算法与后处理
# ==========================================
# 多图融合算法。
# "stochastic": 速度快，适合视角差异不大的多张图。
# "multidiffusion": 数学上更严谨，全局一致性更好，但对显存要求稍高，速度稍慢。
multiimage_algo: "stochastic" 

mesh_simplify: 0.95        # 网格简化比例。0.95 表示保留 95% 的面数。减小此值（如 0.5）可获得更轻量级、更易于实时渲染的模型。
texture_size: 1024         # 纹理贴图分辨率。决定 GLB 文件中纹理的清晰度。支持 1024, 2048, 4096 等。
